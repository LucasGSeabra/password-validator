<div class="mf-validator" [class.mf-validator--loading]="form.pending">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mf-validator__form">
    <div class="mf-validator__card">
      <!-- Cabeçalho do Card -->
      <div class="mf-validator__header">
        <h2 class="mf-validator__title">Validador de Senha</h2>
        <p class="mf-validator__subtitle">
          Digite sua senha para verificar se atende aos critérios de segurança
        </p>
      </div>

      <!-- Campo de Senha -->
      <div class="mf-validator__field">
        <mat-form-field appearance="outline" class="mf-validator__input-field">
          <mat-label>Senha</mat-label>
          <input
            matInput
            [type]="hidePassword() ? 'password' : 'text'"
            formControlName="password"
            placeholder="Digite sua senha"
            autocomplete="new-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="hidePassword() ? 'Mostrar senha' : 'Ocultar senha'"
            class="password-toggle-button"
          >
            <mat-icon class="material-icons"
              >{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon
            >
          </button>

          <!-- Mensagens de Erro -->
          <mat-error *ngIf="form.get('password')?.hasError('required')">
            <mat-icon class="error-icon">error</mat-icon>
            Informe uma senha.
          </mat-error>
          <mat-error *ngIf="error()">
            <mat-icon class="error-icon">error</mat-icon>
            {{ error() }}
          </mat-error>
        </mat-form-field>

        <!-- Resultado da Validação -->
        <div class="mf-validator__result" *ngIf="result()">
          <!-- Mensagens de Erro Específicas -->
          <div
            *ngIf="!!result()?.messages?.length"
            class="mf-validator__error-list"
          >
            <div class="error-header">
              <mat-icon class="error-icon">warning</mat-icon>
              <span>Critérios não atendidos:</span>
            </div>
            <ul class="error-messages">
              <li *ngFor="let message of result()?.messages" class="error-item">
                <mat-icon class="list-icon">close</mat-icon>
                {{ message }}
              </li>
            </ul>
          </div>

          <!-- Mensagem de Sucesso -->
          <div *ngIf="result()?.isValid" class="mf-validator__success">
            <mat-icon class="success-icon">check_circle</mat-icon>
            <span class="success-text">Senha validada com sucesso!</span>
            <p class="success-description">
              Sua senha atende a todos os critérios de segurança.
            </p>
          </div>
        </div>
      </div>

      <!-- Botões de Ação -->
      <div class="mf-validator__actions">
        <button
          mat-stroked-button
          type="button"
          class="mf-validator__button mf-validator__button--secondary"
          (click)="clearForm()"
          [disabled]="form.pending"
        >
          <mat-icon>clear</mat-icon>
          Limpar
        </button>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="mf-validator__button mf-validator__button--primary"
          [disabled]="form.invalid || form.pending"
        >
          <mat-icon *ngIf="form.pending" class="spinning">refresh</mat-icon>
          <mat-icon *ngIf="!form.pending">security</mat-icon>
          {{ form.pending ? 'Validando...' : 'Validar Senha' }}
        </button>
      </div>
    </div>
  </form>
</div>
